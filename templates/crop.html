<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop Recommendation</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script src="{{ url_for('static', filename='js/feedback.js') }}"></script>

<style>

/* GLOBAL */
body{
    margin:0;
    font-family:'DM Sans', sans-serif;
    background: radial-gradient(circle at top left,#2D4A1E,#1A1208);
    color:white;
}

/* BACK BUTTON */
.back{
    margin:20px 40px;
    display:inline-block;
    padding:10px 18px;
    border-radius:12px;
    background:linear-gradient(90deg,#3D6B2C,#5A9B3A);
    text-decoration:none;
    color:white;
    font-family:'Syne';
    font-weight:700;
}

/* TITLE */
.title{
    font-family:'Syne';
    font-size:48px;
    font-weight:800;
    margin:10px 40px;
}

/* CARD */
.card{
    margin:30px 40px;
    padding:30px;
    border-radius:24px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    backdrop-filter:blur(20px);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.06);
    color:white;
}

/* FOCUS */
input:focus{
    outline:none;
    border-color:#5A9B3A;
    box-shadow:0 0 0 3px rgba(90,155,58,0.12);
}

/* BUTTON */
button{
    margin-top:25px;
    padding:14px 24px;
    border:none;
    border-radius:16px;
    background:linear-gradient(90deg,#3D6B2C,#5A9B3A);
    color:white;
    font-family:'Syne';
    font-weight:700;
    cursor:pointer;
}

/* RESULT */
.result{
    margin-top:25px;
    padding:20px;
    border-radius:16px;
    background:rgba(143,202,106,0.06);
    border:1px solid rgba(143,202,106,0.2);
    font-size:18px;
}

</style>
</head>

<body>

<a href="/dashboard" class="back">← Back to Dashboard</a>

<div class="title">🌱 Crop Recommendation</div>

<div class="card">

<form method="POST" action="/crop">

<div class="grid">

<input type="number" step="any" name="N" placeholder="Nitrogen (N)" required>
<input type="number" step="any" name="P" placeholder="Phosphorus (P)" required>
<input type="number" step="any" name="K" placeholder="Potassium (K)" required>

<input type="number" step="any" name="temperature" placeholder="Temperature (°C)" required>
<input type="number" step="any" name="humidity" placeholder="Humidity (%)" required>
<input type="number" step="any" name="ph" placeholder="pH Level" required>

<input type="number" step="any" name="rainfall" placeholder="Rainfall (mm)" required>

</div>

<button>🌱 Predict Crop →</button>

</form>

{% if result %}

<div class="result">
🌾 Recommended Crop: {{ result }}
</div>

<!-- FEEDBACK -->
<div style="margin-top:20px;">
    <h4>Rate this:</h4>
    <button onclick="submitFeedback(1)">⭐</button>
    <button onclick="submitFeedback(2)">⭐⭐</button>
    <button onclick="submitFeedback(3)">⭐⭐⭐</button>
    <button onclick="submitFeedback(4)">⭐⭐⭐⭐</button>
    <button onclick="submitFeedback(5)">⭐⭐⭐⭐⭐</button>

    <br><br>

    <button onclick="markCorrect(true)">✅ Correct</button>
    <button onclick="markCorrect(false)">❌ Wrong</button>
</div>

<script>
window.lastUserInput = "Crop Input";
window.lastAIResponse = "{{ result }}";
</script>

{% endif %}

</div>

</body>
</html>
