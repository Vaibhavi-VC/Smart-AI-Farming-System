<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgriOS Login</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'DM Sans', sans-serif;
    background: radial-gradient(circle at top left, #2D4A1E, #1A1208);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.card{
    width:380px;
    padding:35px;
    border-radius:24px;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    backdrop-filter:blur(20px);
}

/* TITLE */
h2{
    font-family:'Syne';
    font-weight:800;
    letter-spacing:-0.5px;
    margin-bottom:5px;
}

.sub{
    font-size:13px;
    color:rgba(255,255,255,0.4);
    margin-bottom:20px;
}

/* LABEL */
label{
    font-size:11.5px;
    letter-spacing:0.8px;
    color:rgba(255,255,255,0.5);
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.10);
    background:rgba(255,255,255,0.06);
    color:white;
}

input:focus{
    outline:none;
    border-color:#5A9B3A;
    background:rgba(90,155,58,0.08);
    box-shadow:0 0 0 3px rgba(90,155,58,0.12);
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#3D6B2C,#5A9B3A);
    color:white;
    font-family:'Syne';
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
}

/* LINKS */
.links{
    margin-top:15px;
    text-align:center;
    font-size:13px;
}

.links a{
    color:#8FCA6A;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

<h2>Welcome back</h2>
<p class="sub">Sign in to your AgriOS account</p>

<form method="POST" action="/login">
<label>USERNAME</label>
<input type="text" name="username" required>

<label>PASSWORD</label>
<input type="password" name="password" required>

<button>Sign In →</button>
</form>

<div class="links">
    <a href="/" class="back-btn">← Back to Home</a>
<p><a href="/register">New user? Sign up</a></p>
<p><a href="/admin-login">Admin Login</a></p>
</div>

</div>

</body>
</html>
