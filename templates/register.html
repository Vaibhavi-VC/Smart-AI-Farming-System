<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account | AgriOS</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* BODY */
body{
    margin:0;
    font-family:'DM Sans', sans-serif;
    background: radial-gradient(circle at top left, #2D4A1E, #1A1208);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.card{
    width:420px;
    padding:40px;
    border-radius:24px;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    backdrop-filter:blur(20px);
}

/* TITLE */
h2{
    font-family:'Syne';
    font-weight:800;
    letter-spacing:-0.5px;
    margin-bottom:5px;
}

.sub{
    font-size:13px;
    color:rgba(255,255,255,0.4);
    margin-bottom:25px;
}

/* LABEL */
label{
    font-size:11.5px;
    letter-spacing:0.8px;
    color:rgba(255,255,255,0.5);
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.10);
    background:rgba(255,255,255,0.06);
    color:white;
}

input:focus{
    outline:none;
    border-color:#5A9B3A;
    background: rgba(90,155,58,0.08);
    box-shadow:0 0 0 3px rgba(90,155,58,0.12);
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background: linear-gradient(90deg,#3D6B2C,#5A9B3A);
    color:white;
    font-family:'Syne';
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
}

/* DIVIDER */
.divider{
    text-align:center;
    margin:20px 0;
    font-size:12px;
    color:rgba(255,255,255,0.4);
}

/* LINKS */
.links{
    text-align:center;
    font-size:13px;
}

.links a{
    color:#8FCA6A;
    text-decoration:none;
}

/* BACK BUTTON */
.back{
    display:block;
    text-align:center;
    margin-top:15px;
    font-size:13px;
    color:#8FCA6A;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="card">

<h2>Create Account</h2>
<p class="sub">Start your AgriOS journey today</p>

<form method="POST" action="/register">

<label>USERNAME</label>
<input type="text" name="username" placeholder="Enter your username" required>

<label>EMAIL / PHONE</label>
<input type="text" name="email" placeholder="email@example.com or +91..." required>

<label>PASSWORD</label>
<input type="password" name="password" placeholder="Create a strong password" required>

<button>Create Account →</button>

</form>

<div class="divider">or</div>

<div class="links">
    <a href="/" class="back-btn">← Back to Home</a>
<p>Already have an account? <a href="/login">Sign in</a></p>
</div>

<a href="/" class="back">← Back to Entry Page</a>

</div>

</body>
</html>
